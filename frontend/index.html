<!DOCTYPE html>
<html lang="en" class="h-full" style="background-color: #F5EFE6;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetailSphere AI - Enterprise Retail Intelligence</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Identity Services (GSI) SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Global uncaught chunk loading handler for seamless updates across deployments
      window.addEventListener('error', function(event) {
        if (event && event.message && (
          event.message.indexOf('dynamically imported module') !== -1 ||
          event.message.indexOf('Loading chunk') !== -1 ||
          event.message.indexOf('ChunkLoadError') !== -1
        )) {
          console.warn('New version detected or chunk load failed. Reloading page...');
          window.location.reload();
        }
      });
    </script>
  </head>
  <body class="h-full font-sans antialiased text-[#1C1814] bg-[#F5EFE6] selection:bg-[#38A132] selection:text-white" style="background-color: #F5EFE6; margin: 0;">
    <div id="root" class="h-full">
      <div id="app-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background-color: #F5EFE6; color: #2C241D; text-align: center; padding: 20px;">
        <div style="position: relative; width: 56px; height: 56px; margin-bottom: 20px;">
          <div style="box-sizing: border-box; position: absolute; inset: 0; border: 3px solid rgba(56, 161, 50, 0.18); border-top-color: #38A132; border-radius: 50%; animation: rs-spin 0.8s linear infinite;"></div>
          <div style="position: absolute; inset: 6px; background-color: #38A132; border-radius: 50%; opacity: 0.12;"></div>
        </div>
        <p style="font-size: 14px; font-weight: 700; color: #2C241D; letter-spacing: 0.04em; margin: 0 0 6px 0;">RetailSphere AI</p>
        <p style="font-size: 12px; font-weight: 500; color: #7A6C5E; margin: 0;">Loading application...</p>
        <button id="preloader-reload-btn" onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}window.location.reload();" style="display: none; margin-top: 24px; padding: 8px 18px; font-size: 12px; font-weight: 700; color: #1C1814; background: #FFFFFF; border: 1px solid #E2D7CB; border-radius: 9999px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
          Taking too long? Clear Cache & Reload
        </button>
        <script>
          setTimeout(function() {
            var btn = document.getElementById('preloader-reload-btn');
            if (btn) btn.style.display = 'inline-block';
          }, 10000);
        </script>
        <style>
          @keyframes rs-spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
